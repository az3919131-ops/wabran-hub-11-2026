<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقات السلامة نجران</title>
<meta name="description" content="بطاقات السلامة (هويات SCECO) لعمال الوبران فرع نجران: المنتهية والقريبة من الانتهاء، تقارير بالفلترة والتصدير.">
<meta name="theme-color" content="#0F2537">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* الهوية: wabran-najran-energy-ui — كحلي الطاقة، برتقالي الطاقة، رمل نجران */
:root {
  --energy-orange: #F37021; --energy-orange-hover: #D95E16; --energy-navy: #0F2537;
  --wabran-slate: #1E293B; --wabran-steel: #475569;
  --najran-sand: #C89B6E; --najran-clay-soft: #F7F3EE;
  --ink: #0F2537;
  --ink-2: #1A3550;
  --on-ink: #EEF2F6;
  --on-ink-2: #9DB0C3;
  --ground: #F8FAFC;
  --panel: #FFFFFF;
  --text: #1E293B;
  --muted: #475569;
  --line: #E2E8F0;
  --soft: #F7F3EE;
  --mud: #9A6E44;
  --mud-2: #C89B6E;
  --volt: #F37021;
  --bad: #C62B22;  --bad-bg: #FDE4E2;
  --warn: #A15C00; --warn-bg: #FEF0D6;
  --ok: #057A55;   --ok-bg: #D9F5EA;
  --none: #64748B; --none-bg: #EEF2F6;
  --st-done: #10B981; --st-progress: #0EA5E9; --st-pending: #F59E0B; --st-delayed: #EF4444;
  --f-head: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --r-s: 6px; --r-m: 10px;
  --side: 268px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #0A1A28; --ink-2: #15304A; --on-ink: #E6EDF4; --on-ink-2: #8FA4B8;
    --ground: #0D1B29; --panel: #13263A; --text: #E6EDF4; --muted: #A3B4C5; --line: #24405C; --soft: #182E44;
    --mud: #D9B08A; --mud-2: #A97B52; --volt: #FF8A45;
    --bad: #FF8C80; --bad-bg: #3B1E1C; --warn: #F7B955; --warn-bg: #3A2C12; --ok: #4ADE9F; --ok-bg: #10342A;
    --none: #8FA0B2; --none-bg: #1E3348; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #0A1A28; --ink-2: #15304A; --on-ink: #E6EDF4; --on-ink-2: #8FA4B8;
  --ground: #0D1B29; --panel: #13263A; --text: #E6EDF4; --muted: #A3B4C5; --line: #24405C; --soft: #182E44;
  --mud: #D9B08A; --mud-2: #A97B52; --volt: #FF8A45;
  --bad: #FF8C80; --bad-bg: #3B1E1C; --warn: #F7B955; --warn-bg: #3A2C12; --ok: #4ADE9F; --ok-bg: #10342A;
  --none: #8FA0B2; --none-bg: #1E3348; color-scheme: dark;
}



* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--text); font: 15px/1.7 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
.top { background: var(--ink); color: var(--on-ink); }
.top .in { max-width: 1240px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.top b { display: block; font: 700 19px/1.3 var(--f-head); }
.top span { font-size: 13px; color: var(--on-ink-2); }
.top a { color: var(--on-ink); border: 1px solid var(--ink-2); border-radius: 8px; padding: 6px 12px; text-decoration: none; font-size: 14px; }
.tape { height: 6px; background: repeating-linear-gradient(-45deg, var(--volt) 0 10px, var(--ink) 10px 20px); }
main { max-width: 1240px; margin: 0 auto; padding: 22px 16px; }
h1 { font: 700 clamp(24px, 3vw, 32px)/1.3 var(--f-head); margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; }
footer { text-align: center; padding: 18px; border-top: 1px solid var(--line); color: var(--muted); font: 500 13.5px var(--f-head); direction: ltr; }
.btn { display: inline-flex; gap: 6px; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: var(--r-m); padding: 8px 16px; cursor: pointer; font-weight: 500; text-decoration: none; font-size: 14px; }
.btn:hover { border-color: var(--text); }
.btn.pri { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.sm { padding: 3px 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.pill { display: inline-block; border-radius: 99px; padding: 0 10px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.p-bad { background: var(--bad-bg); color: var(--bad); } .p-warn { background: var(--warn-bg); color: var(--warn); } .p-ok { background: var(--ok-bg); color: var(--ok); } .p-none { background: var(--none-bg); color: var(--muted); }
.count { font-size: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; color: var(--muted); }
.note { background: var(--warn-bg); color: var(--warn); border-radius: var(--r-m); padding: 9px 14px; font-size: 14px; margin-bottom: 16px; }
</style>
<link rel="stylesheet" href="safety-app.css">
</head>
<body>
<header class="top"><div class="in"><div><b>بطاقات السلامة · نجران</b><span>الوبران — هويات SCECO للعمال</span></div><a href="https://wabran-najran-hub.netlify.app/#/app/safety">فتح داخل منصة الوبران</a></div></header>
<div class="tape" aria-hidden="true"></div>
<main><h1>بطاقات السلامة</h1><p class="sub">المنتهية والقريبة من الانتهاء، وتقارير بأي فلتر مع التصدير إلى Excel أو CSV أو الطباعة. البيانات مشتركة مع منصة الوبران.</p><div id="app"></div></main>
<footer>Project Manager | Eng. Ahmed Zahran</footer>
<script src="xlsx.full.min.js"></script>
<script>window.XLSX||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>')</script>
<script src="safety-app.js"></script>
<script>
  // إن جاء الطلب من البوابة نفسها (المعاينة المحلية) تُستخدم القاعدة المحلية، وإلا قاعدة البوابة المنشورة
  var API = location.hostname === "localhost" && location.port === "8767" ? "http://localhost:8765/api/data" : "https://wabran-najran-hub.netlify.app/api/data";
  (function start() {
    if (!window.WabranAuth) return setTimeout(start, 50);
    WabranAuth.ready.then(function (u) {
      var lv = (u.access && u.access.safety) || "none";
      SafetyApp.mount(document.getElementById("app"), { api: API, seed: { asof: "", rows: [] }, headers: WabranAuth.headers, canEdit: lv === "edit", canExport: lv === "edit" || lv === "export" });
    });
  })();
</script>
<script src="/wabran-nav.js" data-platform="safety" defer></script>
</body>
</html>
